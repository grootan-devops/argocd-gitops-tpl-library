include:
  - project: "devops/ci-templates"
    ref: 2.0.0/dev
    file:
      - '/common/.gitlab-ci.yml'
      - '/readme/.migration-guide.gitlab.yml'
      - '/chart/.gitlab-ci.yml'
      - '/release/.gitlab-ci.yml'
      - '/release/.notification.gitlab-ci.yml'

variables:
  CHART_DIR: '.'
  CHART_REPOSITORY: "helm"

Chart:Scan:
  rules:
    - when: never
