# Enable or disable all generated Argo CD Applications.
enabled: true

# Required cluster name segment in generated Application names.
cluster: midgard
# Optional environment suffix; leave empty to omit it from names.
environment: sample
# Argo CD Project and registered destination cluster name.
project: default
server: in-cluster
# Git clone URL for Application manifests (excluding extras).
repoURL: https://gitlab.com/gitops.git
# Optional source revision. When empty, it defaults to
# Chart.Name/environment or Chart.Name.
branch: ""
# When true, omit finalizers and preserve resources on deletion.
preserveResourcesOnDeletion: false
# Keep false; reconcile raw manifests through generated Extras Applications.
renderExtrasManifests: false
# Optional workload namespace; defaults to Chart.Name-environment or Chart.Name.
namespace: ""

# Global sync policy fallback for all apps
sync:
  options:
    - Validate=true
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - RespectIgnoreDifferences=true
    - ApplyOutOfSyncOnly=true
  retry:
    limit: 5
    backoff:
      duration: 5s
      factor: 2
      maxDuration: 3m
  ignoreDifferences: []

# Adds argocd notification annotations
notification:
  notification1:
    template: teams-template
    channel:
      - team-channel

# ─────────────────────────────────────────────
# Extras Folder (non-Helm applications)
# This creates a separate ArgoCD app pointing to "extras" path in the same repo
extras:
  enabled: true
  sync:
    automated:
      prune: true
      selfHeal: true
    options: []
    retry: {}

apps:
  # App path: .Values.samplea.sample1
  # Computed:
  # - releaseName: test (explicit)
  # - appName:     sample-sample-sample (default pattern from key)
  sample:
    enabled: true
    chart:
      repoURL: chart.cr.io/helm
      version: 0.1.0
      name: test
    sync:
      automated:
        prune: true
        selfHeal: true
      options: []
      retry: {}

  groupa:
    enabled: true
    namespace: group-namespace

    # App path: .Values.samplea.sample1
    # Computed:
    # - releaseName: sample1-override (explicit)
    # - appName:     sample-sample1-sample (default pattern from key)
    # - Namespace - namespace-override
    sample1:
      enabled: true
      releaseName: sample1-override
      namespace: namespace-override
      chart:
        repoURL: chart.cr.io/helm
        version: 0.1.0
        name: acme-core
      sync:
        automated:
          prune: true
          selfHeal: true
        options: []
        retry: {}

    # App path: .Values.samplea.sample2
    # Computed:
    # - releaseName: sample2-override (explicit override)
    # - Disables auto-sync by setting empty map
    # - Namespace - group-namespace
    sample2:
      enabled: true
      releaseName: sample2-override
      chart:
        repoURL: chart.cr.io/helm
        version: 0.1.0
        name: sample2
      sync:
        automated: {}  # disables auto-sync; manual sync only
        options: []
        retry: {}

    # Looks for 'values/groupa/sample3/', which must be a valid Helm directory.
    sample3:
      enabled: true
      namespace: sample3
      releaseName: sample3
      chart:
        path: sample3
        valuesFiles:
          - values1.yaml
      sync:
        automated:
          prune: true
          selfHeal: true
