# Enable or disable all generated Argo CD Applications.
enabled: true

# Optional cluster name segment; leave empty or omit to exclude it from names.
cluster: ""
# Optional environment suffix; leave empty to omit it from names.
environment: sample
# Argo CD Project and registered destination cluster name.
project: default
server: in-cluster
# Git clone URL for Application manifests (excluding extras).
repoURL: https://gitlab.com/gitops.git
# Optional source revision. When empty, it defaults to
# Chart.Name/environment or Chart.Name.
branch: ""
# When true, omit finalizers and preserve resources on deletion.
preserveResourcesOnDeletion: false
# Keep false; reconcile raw manifests through generated Extras Applications.
renderExtrasManifests: false
# Optional workload namespace; defaults to Chart.Name-environment or Chart.Name.
namespace: ""

# Global sync policy fallback for all apps
sync:
  options:
    - Validate=true
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - RespectIgnoreDifferences=true
    - ApplyOutOfSyncOnly=true
  retry:
    limit: 5
    backoff:
      duration: 5s
      factor: 2
      maxDuration: 3m
  ignoreDifferences: []

# Adds argocd notification annotations
notification:
  notification1:
    template: teams-template
    channel:
      - team-channel

# ─────────────────────────────────────────────
# Extras Folder (non-Helm applications)
# This creates a separate ArgoCD app pointing to "extras" path in the same repo
extras:
  enabled: true
  sync:
    automated:
      prune: true
      selfHeal: true
    options: []
    retry: {}

apps:
  # Entry path: .apps.sample
  # Rendered:
  # - releaseName: test (the chart name, by default)
  # - Application: <Chart.Name>[-<cluster>]-sample[-<environment>]
  sample:
    enabled: true
    chart:
      repoURL: chart.cr.io/helm
      version: 0.1.0
      name: test
    # Optional: select a CMP registered in Argo CD; omit to use native Helm.
    # plugin:
    #   name: kustomized-helm
    #   skipCrds: false # Optional; omit or false includes CRDs, true skips them.
    #   kustomize:
    #     patches:
    #       - target:
    #           group: apps
    #           version: v1
    #           kind: Deployment
    #           name: test
    #         patch: |-
    #           - op: add
    #             path: /spec/revisionHistoryLimit
    #             value: 0
    sync:
      automated:
        prune: true
        selfHeal: true
      options: []
      retry: {}

  groupa:
    enabled: true
    namespace: group-namespace

    # Entry path: .apps.groupa.sample1
    # Rendered:
    # - releaseName: sample1-override (explicit)
    # - Application: <Chart.Name>[-<cluster>]-groupa-sample1[-<environment>]
    # - namespace:   namespace-override (the entry's, over the group's)
    sample1:
      enabled: true
      releaseName: sample1-override
      namespace: namespace-override
      chart:
        repoURL: chart.cr.io/helm
        version: 0.1.0
        name: acme-core
      sync:
        automated:
          prune: true
          selfHeal: true
        options: []
        retry: {}

    # Entry path: .apps.groupa.sample2
    # Rendered:
    # - releaseName: sample2-override (explicit)
    # - automated: {} keeps automated sync on; omit automated for manual sync
    # - namespace:   group-namespace (the group's)
    sample2:
      enabled: true
      releaseName: sample2-override
      chart:
        repoURL: chart.cr.io/helm
        version: 0.1.0
        name: sample2
      sync:
        automated: {}  # still automated sync; omit automated for manual sync
        options: []
        retry: {}

    # A chart stored in this repository at sample3/ (from the repository root): it reads its
    # own values.yaml and the valuesFiles below from there, not from values/.
    sample3:
      enabled: true
      namespace: sample3
      releaseName: sample3
      chart:
        path: sample3
        valuesFiles:
          - values1.yaml
      sync:
        automated:
          prune: true
          selfHeal: true
