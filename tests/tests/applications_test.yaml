suite: ArgoCD application contracts
templates:
  - templates/apps.yaml
tests:
  - it: renders standalone and nested applications with canonical names
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: contoso-midgard-admin-frontend-dev
        documentIndex: 0
      - equal:
          path: spec.source.targetRevision
          value: "1.0.0"
        documentIndex: 1
      - equal:
          path: metadata.name
          value: contoso-midgard-api-dev
        documentIndex: 1
      - equal:
          path: metadata.name
          value: contoso-midgard-extras-dev
        documentIndex: 2
      - equal:
          path: spec.source.targetRevision
          value: payments/dev
        documentIndex: 2
  - it: disables selected applications and preserves resources
    values:
      - ../values/disabled.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: contoso-midgard-admin-frontend-qa
      - notExists:
          path: metadata.finalizers
  - it: honours the global enabled switch for every application type
    values:
      - ../values/global-disabled.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: rejects direct extras rendering from the root chart
    values:
      - ../values/render-extras.yaml
    asserts:
      - failedTemplate:
          errorMessage: >-
            renderExtrasManifests must remain false: raw manifests are
            reconciled through the generated Extras Applications
  - it: renders every Helm application shape with override precedence
    values:
      - ../values/permutations.yaml
    asserts:
      - hasDocuments:
          count: 5
      # Apps are emitted in lexical root-key order: group, local, nested,
      # standalone, then the extras parent.
      - equal:
          path: metadata.name
          value: contoso-midgard-group-child-prod
        documentIndex: 0
      - equal:
          path: spec.destination.namespace
          value: group-ns
        documentIndex: 0
      - equal:
          path: metadata.name
          value: contoso-midgard-local-prod
        documentIndex: 1
      - equal:
          path: spec.source.path
          value: charts/local-service
        documentIndex: 1
      - equal:
          path: spec.source.helm.releaseName
          value: local-release
        documentIndex: 1
      - contains:
          path: spec.source.helm.valueFiles
          content: prod.yaml
        documentIndex: 1
      - equal:
          path: metadata.name
          value: contoso-midgard-nested-backend-worker-prod
        documentIndex: 2
      - equal:
          path: spec.destination.namespace
          value: nested-group-ns
        documentIndex: 2
      - equal:
          path: metadata.name
          value: contoso-midgard-standalone-prod
        documentIndex: 3
      - equal:
          path: spec.source.helm.releaseName
          value: standalone-release
        documentIndex: 3
      - equal:
          path: spec.destination.namespace
          value: standalone-ns
        documentIndex: 3
      - equal:
          path: spec.syncPolicy.automated
          value: {}
        documentIndex: 3
      - contains:
          path: spec.syncPolicy.syncOptions
          content: Validate=false
        documentIndex: 3
      - contains:
          path: spec.syncPolicy.syncOptions
          content: PruneLast=true
        documentIndex: 3
      - equal:
          path: spec.syncPolicy.retry.limit
          value: 9
        documentIndex: 3
      - equal:
          path: spec.ignoreDifferences[0].jsonPointers[0]
          value: /status
        documentIndex: 3
      - equal:
          path: spec.ignoreDifferences[1].jsonPointers[0]
          value: /spec/replicas
        documentIndex: 3
      - exists:
          path: metadata.annotations
        documentIndex: 3
      - equal:
          path: metadata.name
          value: contoso-midgard-extras-prod
        documentIndex: 4
      - equal:
          path: spec.destination.name
          value: dev-cluster
        documentIndex: 4
      - equal:
          path: spec.syncPolicy.automated.prune
          value: false
        documentIndex: 4

  - it: defaults branch and workload namespace from chart name and environment
    values:
      - ../values/defaults.yaml
    asserts:
      - equal:
          path: metadata.name
          value: contoso-midgard-api-dev
        documentIndex: 1
      - equal:
          path: spec.source.targetRevision
          value: contoso/dev
        documentIndex: 1
      - equal:
          path: spec.destination.namespace
          value: contoso-dev
        documentIndex: 1

  - it: omits the environment suffix and defaults the project namespace
    values:
      - ../values/no-environment.yaml
    asserts:
      - equal:
          path: metadata.name
          value: contoso-midgard-api
        documentIndex: 1
      - equal:
          path: spec.destination.namespace
          value: contoso
        documentIndex: 1
