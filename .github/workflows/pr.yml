name: CI · PR Verification
run-name: "CI · PR Verification · ${{ github.event_name }} · ${{ github.sha }}"

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  init:
    uses: grootan-devops/github-ci-library/.github/workflows/init.yml@1.0.0
    permissions:
      contents: read
      actions: read
      pull-requests: read
    secrets: inherit
    with:
      chart-dir: "."
      ignore-docker: "true"

  check:
    needs: init
    uses: grootan-devops/github-ci-library/.github/workflows/check.yml@1.0.0
    permissions:
      contents: read
    secrets: inherit
    with:
      tag: ${{ needs.init.outputs.tag }}
      chart-name: ${{ needs.init.outputs.chart-name }}
      chart-version: ${{ needs.init.outputs.chart-push-version }}
      chart-repository: ${{ needs.init.outputs.chart-repository }}
      chart-dir: "."

  lint:
    uses: grootan-devops/github-ci-library/.github/workflows/lint.yml@1.0.0
    permissions:
      contents: read
    secrets: inherit
    with:
      chart-dir: "."
      lint-md-files: "**/*.md !**/README.md"

  chart:
    needs: init
    uses: grootan-devops/github-ci-library/.github/workflows/chart.yml@1.0.0
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      chart-name: ${{ needs.init.outputs.chart-name }}
      chart-version: ${{ needs.init.outputs.chart-version }}
      chart-app-version: ${{ needs.init.outputs.chart-app-version }}
      chart-repository: ${{ needs.init.outputs.chart-push-repository }}
      check-docs: false
      run-unittest: true
      mock-chart: "tests"
      chart-dir: "."
      publish-candidate: false

  chart-extras-unittest:
    name: Chart / Extras Unit Test
    needs: init
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: grootantech/toolkit:1.0.0
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Update Extras Test Chart Dependencies
        run: helm dependency update tests/extras

      - name: Run Extras helm-unittest
        run: |
          set -o pipefail
          helm unittest --strict \
            --output-type JUnit \
            --output-file "${RUNNER_TEMP}/extras-unittest-report.xml" \
            tests/extras

      - name: Upload Extras Unit Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chart-extras-unittest-report
          path: ${{ runner.temp }}/extras-unittest-report.xml
          if-no-files-found: warn
          retention-days: 7

  secret-scan:
    uses: grootan-devops/github-ci-library/.github/workflows/secret-scanning.yml@1.0.0
    permissions:
      contents: read
    secrets: inherit
    with:
      full-history: false
