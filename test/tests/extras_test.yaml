suite: ArgoCD extras contracts
templates:
  - templates/extras.yaml
tests:
  - it: derives environment from the branch and renders root and nested manifests
    values:
      - ../values/extras.yaml
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: contoso-platform-extras-staging-clamav
        documentIndex: 0
      - notExists:
          path: metadata.finalizers
        documentIndex: 0
      - equal:
          path: spec.destination.namespace
          value: security
        documentIndex: 0
      - equal:
          path: metadata.name
          value: contoso-platform-extras-staging-root
        documentIndex: 1
